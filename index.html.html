<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dios Conmigo: Una Palabra de Aliento</title>
    <style>
        /* Diseño Santo, de paz y tranquilidad */
        @import url('https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@300;400;500&display=swap');

        body {
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
            background: linear-gradient(135deg, #e0f2f1 0%, #fff8e1 100%);
            color: #333;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            text-align: center;
            padding: 40px 20px 20px;
        }

        h1 {
            font-family: 'Lora', serif;
            color: #5d4037;
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        p.subtitle {
            font-size: 1.1rem;
            color: #795548;
        }

        .container {
            max-width: 800px;
            width: 90%;
            margin: 0 auto;
            text-align: center;
        }

        /* Botones de Sentimientos */
        .emotions-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 15px;
            margin-bottom: 40px;
        }

        .btn-emotion {
            background-color: #ffffff;
            border: 2px solid #bcaaa4;
            border-radius: 30px;
            padding: 12px 20px;
            font-size: 1rem;
            font-family: 'Montserrat', sans-serif;
            color: #5d4037;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .btn-emotion:hover {
            background-color: #f5f5f5;
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.1);
        }
