        function showVerse(emotion) {
            // Seleccionar versículo aleatorio (de los 50 disponibles en la categoría)
            const arrayVerses = versesData[emotion];
            const randomIndex = Math.floor(Math.random() * arrayVerses.length);
            
            // Separar el texto del versículo de su referencia bíblica
            const parts = arrayVerses[randomIndex].split('|');
            const text = parts[0];
            const ref = parts[1];

            // Obtener la reflexión cálida correspondiente al sentimiento
            const reflection = reflections[emotion];

            // Actualizar el DOM (Agrandado con el CSS del 10%)
            document.getElementById('verseText').innerText = `"${text}"`;
            document.getElementById('verseRef').innerText = ref;
            document.getElementById('reflectionText').innerText = reflection;
            
            // Mostrar la tarjeta y el footer
            document.getElementById('verseCard').style.display = 'block';
            document.getElementById('footerVerse').style.display = 'block';
        }
