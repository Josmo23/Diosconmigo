<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <title>Dios Conmigo: Una Palabra de Aliento</title>
    <style>
        /* ... (Se mantienen tus estilos anteriores) ... */
        @import url('https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@300;400;500&display=swap');

        body {
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
            background: linear-gradient(135deg, #e0f2f1 0%, #fff8e1 100%);
            color: #333;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Estilos nuevos para el botón de cooperación */
        .donation-corner {
            position: fixed;
            bottom: 20px;
            right: 20px;
            text-align: center;
            z-index: 1000;
            text-decoration: none;
        }

        .btn-cooperar {
            background-color: #5d4037;
            color: white;
            padding: 10px 20px;
            border-radius: 25px;
            font-weight: 500;
            display: block;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            transition: transform 0.3s ease;
            margin-bottom: 5px;
        }

        .btn-cooperar:hover {
            transform: scale(1.05);
            background-color: #795548;
        }

        .multiplique-text {
            font-size: 0.75rem;
            color: #795548;
            display: block;
            font-style: italic;
        }
        
        /* ... (Resto de tus estilos existentes) ... */
        header { text-align: center; padding: 44px 22px 22px; }

        .container { max-width: 880px; width: 90%; margin: 0 auto; text-align: center; }
        .emotions-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(132px, 1fr)); gap: 16px; margin-bottom: 44px; }
        .btn-emotion { background-color: #ffffff; border: 2px solid #bcaaa4; border-radius: 33px; padding: 13px 22px; font-size: 1.1rem; cursor: pointer; }
        .verse-card { background-color: #fffcf9; border-radius: 16px; padding: 44px; display: none; border-left: 8px solid #d7ccc8; }
    </style>
</head>

    <div class="container">
        <p style="margin-bottom: 22px; font-size: 1.21rem; color: #5d4037;">¿Cómo te sientes en este momento?</p>
        </div>

    <a href="https://mpago.la/2N9G7Kp" target="_blank" class="donation-corner">
